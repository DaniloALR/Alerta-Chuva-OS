# AlertaChuva · proxy reverso Nginx -> Gunicorn (gerado por 05_servicos.sh)
server {
    listen 80 default_server;
    server_name @DOMINIO@ api.@DOMINIO@ @IP_SERVICO@ localhost;

    access_log /var/log/nginx/alertachuva_acesso.log;
    error_log  /var/log/nginx/alertachuva_erro.log warn;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:@APP_PORTA@;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
